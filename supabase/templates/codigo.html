<h2>Tu código para entrar a Mazo</h2>
<p>Escribe este código en la página donde pediste entrar:</p>
<p style="font-size: 28px; font-weight: bold; letter-spacing: 6px">{{ .Token }}</p>
<p>O entra directo con este enlace: <a href="{{ .SiteURL }}/auth/confirmar?token_hash={{ .TokenHash }}&type=email">Entrar a Mazo</a></p>
<p>Vence en 10 minutos. Si no fuiste tú, ignora este correo.</p>
